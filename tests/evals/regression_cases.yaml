version: 1
regression_cases:
  - id: fastapi-status-endpoint
    description: FastAPI weekly status summary endpoint
    requirement_card:
      technical_context:
        environment: Python with FastAPI and Pydantic
      core_task_scope:
        task_type: new feature logic
        objective: Add FastAPI endpoint for weekly engineering status summaries.
      inputs_outputs_contracts:
        output_contract: JSON with blockers, owners, and next steps
      architectural_rules:
        non_functional:
          - Keep the response within 300 words.
          - Covers blockers and owners.
      unresolved_fields: []
    baseline_body: |
      Technical Context
      -----------------
      Environment: Python with FastAPI and Pydantic

      Core Task and Scope
      -------------------
      Task type: new feature logic
      Objective: Add FastAPI endpoint for weekly engineering status summaries.

      Inputs, Outputs, and Contracts
      ------------------------------
      Output contract: JSON with blockers, owners, and next steps.

      Architectural Rules and Constraints
      -----------------------------------
      Keep the response within 300 words.
      Covers blockers and owners.

      Edge Cases and Error Strategy
      -----------------------------
      Failure handling: raise HTTPException on validation errors.

      Response Formatting
      -------------------
      Explanation level: brief rationale then code.
    must_preserve:
      - weekly engineering status
      - blockers
    critical_safety: true
    safety_forbidden_patterns:
      - invent metrics
      - guaranteed outcome

  - id: onboarding-checklist-api
    description: Onboarding checklist generator with unspecified explanation
    requirement_card:
      technical_context:
        environment: Python CLI tooling
      core_task_scope:
        objective: Draft onboarding checklist generator for new hires.
      response_formatting:
        explanation_level: ""
      unresolved_fields:
        - response_formatting.explanation_level
      architectural_rules:
        non_functional:
          - Cover first-week tasks.
    baseline_body: |
      Technical Context
      -----------------
      Environment: Python CLI tooling

      Core Task and Scope
      -------------------
      Objective: Draft onboarding checklist generator for new hires.

      Inputs, Outputs, and Contracts
      ------------------------------
      Output contract: Checklist with owners and due dates.

      Architectural Rules and Constraints
      -----------------------------------
      Keep it concise.
      Cover first-week tasks.

      Edge Cases and Error Strategy
      -----------------------------
      Failure handling: return empty checklist on missing inputs.

      Response Formatting
      -------------------
      Explanation level: unspecified
    must_preserve:
      - onboarding checklist
      - first-week
    critical_safety: false
    safety_forbidden_patterns: []

  - id: interview-notes-parser
    description: Interview notes parser for product discovery
    requirement_card:
      technical_context:
        environment: Python with Pydantic
      core_task_scope:
        objective: Parse customer interview notes into structured product themes.
      inputs_outputs_contracts:
        output_contract: Structured themes with supporting quotes
      architectural_rules:
        non_functional:
          - Do not invent customer quotes.
          - Separate pains from feature requests.
      unresolved_fields: []
    baseline_body: |
      Technical Context
      -----------------
      Environment: Python with Pydantic

      Core Task and Scope
      -------------------
      Objective: Parse customer interview notes into structured product themes.

      Inputs, Outputs, and Contracts
      ------------------------------
      Output contract: Structured themes with supporting quotes.

      Architectural Rules and Constraints
      -----------------------------------
      Avoid invent customer quotes.
      Separate pains from feature requests.

      Edge Cases and Error Strategy
      -----------------------------
      Failure handling: skip empty transcripts.

      Response Formatting
      -------------------
      Explanation level: code only.
    must_preserve:
      - customer interview
      - product
    critical_safety: true
    safety_forbidden_patterns:
      - invent metrics
      - fabricated quote

